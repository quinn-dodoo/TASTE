<!doctype html><html lang="en"><meta charset="utf-8"><title>TASTE background checks</title>
<style>body{margin:20px;background:#111;color:white;font:14px monospace}main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}canvas{width:100%;aspect-ratio:16/9}h2{font-size:14px}output{display:block;margin:8px 0}</style>
<h1>TASTE background checks</h1><output id="status">Starting…</output><main id="gallery"></main>
<script src="../backgrounds.js"></script><script>
const engines = TasteBackground.MODES.map(mode => {
 const section = document.createElement('section');
 const label = document.createElement('h2'); label.textContent = mode;
 const canvas = document.createElement('canvas'); canvas.width=960;canvas.height=540;
 section.append(label,canvas);document.querySelector('main').append(section);
 return {engine:new TasteBackground({mode,seed:8101}),context:canvas.getContext('2d')};
});
let frames=0;const costs=[];
function draw(now){
 try{const start=performance.now();engines.forEach(({engine,context})=>engine.draw(context,960,540,now));
 costs.push(performance.now()-start);if(costs.length>180)costs.shift();frames++;
 if(frames%30===0)document.querySelector('output').textContent=`PASS: all 7 systems running · ${frames} frames · all-system render p95 ${[...costs].sort((a,b)=>a-b)[Math.floor(costs.length*.95)].toFixed(1)} ms`;
 requestAnimationFrame(draw);
 }catch(error){document.querySelector('output').textContent=`FAIL: ${error.message}`;throw error;}
}requestAnimationFrame(draw);
</script></html>
